<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orange Drone Compagnon - 10 maquettes téléchargement</title>
  <style>
    :root {
      --orange: #ff7900;
      --orange-soft: rgba(255, 121, 0, .22);
      --cyan: #4bb4e6;
      --green: #50be87;
      --purple: #a885d8;
      --yellow: #ffd200;
      --black: #000;
      --white: #fff;
      --ink: #071014;
      --glass: rgba(255, 255, 255, .105);
      --glass-strong: rgba(255, 255, 255, .18);
      --line: rgba(255, 255, 255, .22);
      --muted: rgba(255, 255, 255, .72);
      font-family: Arial, Helvetica, sans-serif;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--white);
      background: #050708;
      font-family: Arial, Helvetica, sans-serif;
    }

    .nav {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 14px 22px;
      background: rgba(0, 0, 0, .76);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255,255,255,.14);
    }

    .nav strong {
      font-size: 20px;
    }

    .nav span {
      color: var(--muted);
      font-size: 14px;
    }

    .jump {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .jump a {
      min-width: 34px;
      min-height: 34px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.08);
      color: white;
      text-decoration: none;
      font-weight: 900;
    }

    .mockup {
      min-height: 100vh;
      padding: 36px;
      display: grid;
      place-items: center;
      border-bottom: 1px solid rgba(255,255,255,.14);
      background:
        linear-gradient(180deg, rgba(0,0,0,.24), rgba(0,0,0,.72)),
        var(--bg-image) center / cover no-repeat;
    }

    .stage {
      position: relative;
      width: min(1240px, 100%);
      min-height: 680px;
      overflow: hidden;
      border-radius: 34px;
      border: 1px solid rgba(255,255,255,.22);
      box-shadow: 0 34px 120px rgba(0,0,0,.58);
      background:
        radial-gradient(circle at 18% 90%, rgba(255,121,0,.26), transparent 38%),
        linear-gradient(135deg, rgba(13,35,39,.78), rgba(0,0,0,.86));
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(120deg, transparent 0 63%, rgba(255,255,255,.09) 63% 64%, transparent 64%),
        radial-gradient(circle at 84% 12%, rgba(75,180,230,.12), transparent 24%);
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
      min-height: 680px;
      padding: 34px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand img {
      width: 210px;
      max-height: 86px;
      object-fit: contain;
      border-radius: 14px;
      background: rgba(255,255,255,.92);
      padding: 8px 12px;
    }

    .brand-title {
      font-size: 38px;
      line-height: 1;
      font-weight: 900;
    }

    .brand-title em {
      color: var(--orange);
      font-style: normal;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--orange);
      font-size: 15px;
      font-weight: 900;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 6vw, 86px);
      line-height: .92;
      letter-spacing: 0;
    }

    h2 {
      margin: 0;
      font-size: clamp(32px, 4vw, 58px);
      line-height: 1;
    }

    p {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.45;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 58px;
      padding: 0 28px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.2);
      background: var(--orange);
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: 900;
      box-shadow: 0 20px 60px rgba(255,121,0,.34);
    }

    .btn.dark {
      background: rgba(255,255,255,.11);
      box-shadow: none;
    }

    .panel, .tile, .stat, .pill {
      border: 1px solid rgba(255,255,255,.18);
      background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.055));
      backdrop-filter: blur(22px);
      box-shadow: inset 0 1px rgba(255,255,255,.16), 0 18px 50px rgba(0,0,0,.30);
    }

    .panel {
      border-radius: 26px;
      padding: 26px;
    }

    .tile {
      min-height: 132px;
      border-radius: 24px;
      padding: 22px;
    }

    .tile b {
      display: block;
      font-size: 20px;
    }

    .tile span {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      line-height: 1.35;
    }

    .stat {
      border-radius: 18px;
      padding: 18px;
      color: rgba(255,255,255,.65);
      font-weight: 800;
    }

    .stat b {
      display: block;
      margin-top: 8px;
      color: white;
      font-size: 30px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      color: rgba(255,255,255,.82);
      font-size: 13px;
      font-weight: 900;
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .stack { display: grid; gap: 18px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .spacer { height: 26px; }
    .muted { color: var(--muted); }
    .orange { color: var(--orange); }

    .mockup-label {
      position: absolute;
      top: 22px;
      right: 22px;
      z-index: 2;
      padding: 8px 12px;
      border-radius: 12px;
      background: rgba(0,0,0,.54);
      border: 1px solid rgba(255,255,255,.18);
      color: rgba(255,255,255,.75);
      font-weight: 900;
      font-size: 13px;
    }

    .hero-photo {
      min-height: 410px;
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,.18);
      background: linear-gradient(180deg, transparent, rgba(0,0,0,.60)), var(--photo) center / cover no-repeat;
      box-shadow: 0 28px 80px rgba(0,0,0,.40);
    }

    .phone-card {
      width: 330px;
      min-height: 560px;
      border-radius: 38px;
      padding: 24px;
      background: rgba(0,0,0,.72);
      border: 1px solid rgba(255,255,255,.24);
      box-shadow: 0 28px 90px rgba(0,0,0,.58);
    }

    .download-strip {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: center;
      padding: 18px;
      border-radius: 22px;
      background: rgba(255,121,0,.16);
      border: 1px solid rgba(255,121,0,.38);
    }

    .big-number {
      font-size: 132px;
      line-height: .8;
      font-weight: 900;
      color: rgba(255,255,255,.10);
    }

    .feature-icon {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: rgba(255,121,0,.18);
      color: var(--orange);
      font-size: 26px;
      font-weight: 900;
    }

    .split-left {
      display: grid;
      grid-template-columns: .88fr 1.12fr;
      gap: 28px;
      align-items: stretch;
    }

    .centered {
      display: grid;
      place-items: center;
      text-align: center;
    }

    .thin {
      font-size: clamp(40px, 5vw, 74px);
      font-weight: 900;
    }

    .release-list {
      display: grid;
      gap: 10px;
    }

    .release-item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 14px;
      border-radius: 16px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
    }

    .badge {
      display: inline-grid;
      place-items: center;
      min-width: 46px;
      height: 46px;
      border-radius: 14px;
      background: rgba(255,121,0,.22);
      color: var(--orange);
      font-weight: 900;
    }

    .m1 { --bg-image: url("../app/src/main/res/drawable-nodpi/home_site_sunset.jpg"); }
    .m2 { --bg-image: url("../app/src/main/res/drawable-nodpi/bg_techniciens_tour.jpg"); }
    .m3 { --bg-image: url("../app/src/main/res/drawable-nodpi/screen_bg_tower_77.jpg"); }
    .m4 { --bg-image: url("../app/src/main/res/drawable-nodpi/screen_bg_dji_site.jpg"); }
    .m5 { --bg-image: url("../app/src/main/res/drawable-nodpi/home_site_sunset.jpg"); }
    .m6 { --bg-image: url("../app/src/main/res/drawable-nodpi/screen_bg_tower_33.jpg"); }
    .m7 { --bg-image: url("../app/src/main/res/drawable-nodpi/bg_home_readable.jpg"); }
    .m8 { --bg-image: url("../app/src/main/res/drawable-nodpi/screen_bg_orange_property.jpg"); }
    .m9 { --bg-image: url("../app/src/main/res/drawable-nodpi/screen_bg_snow.jpg"); }
    .m10 { --bg-image: url("../app/src/main/res/drawable-nodpi/home_site_sunset.jpg"); }

    @media (max-width: 900px) {
      .mockup { padding: 16px; }
      .content { min-height: auto; padding: 22px; }
      .stage { min-height: auto; border-radius: 22px; }
      .split-left, .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
      .brand img { width: 160px; }
      .phone-card { width: 100%; }
      .download-strip { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body><section id="m4" class="mockup m4">
    <div class="stage">
      <div class="mockup-label">04 - Minimal corporate</div>
      <div class="content centered">
        <div class="panel stack" style="max-width:860px">
          <img src="../app/src/main/res/drawable-nodpi/orange_drone_compagnon_logo.png" alt="Orange Drone Compagnon" style="width:360px;max-width:100%;justify-self:center;border-radius:18px;background:white;padding:12px">
          <div>
            <p class="eyebrow">Téléchargement sécurisé</p>
            <h1 class="thin">Orange Drone Compagnon</h1>
            <p>APK Android interne destinée aux radiocommandes DJI de la flotte Orange.</p>
          </div>
          <div class="row" style="justify-content:center">
            <span class="pill">Version 1.30</span>
            <span class="pill">DJI RC Plus 2</span>
            <span class="pill">DJI RC 2</span>
          </div>
          <a class="btn" href="#" style="justify-self:center;min-width:320px">Télécharger l’APK</a>
        </div>
      </div>
    </div>
  </section></body>
</html>
