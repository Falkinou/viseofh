name: viseofh

services:
  web:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: viseofh-web
    hostname: viseofh-web
    expose:
      - "8080"
    volumes:
      - ./www:/usr/share/nginx/html:ro
      - ./apks:/usr/share/nginx/html/odc/releases:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
      - /var/cache/nginx:rw,nosuid,nodev,noexec,size=16m
      - /var/run:rw,nosuid,nodev,noexec,size=4m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/odc/version.json || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.docker.network=mca-public
      - traefik.http.routers.viseofh.entrypoints=websecure
      - traefik.http.routers.viseofh.rule=Host(`viseofh.fr`) || Host(`www.viseofh.fr`)
      - traefik.http.routers.viseofh.tls.certresolver=letsencrypt
      - traefik.http.routers.viseofh.middlewares=viseofh-security@docker
      - traefik.http.middlewares.viseofh-security.headers.contenttypenosniff=true
      - traefik.http.middlewares.viseofh-security.headers.framedeny=true
      - traefik.http.middlewares.viseofh-security.headers.referrerpolicy=strict-origin-when-cross-origin
      - traefik.http.services.viseofh.loadbalancer.server.port=8080
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    restart: unless-stopped

networks:
  proxy:
    external: true
    name: mca-public
